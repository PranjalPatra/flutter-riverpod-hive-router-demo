name: todo_riverpod_demo
description: "A Riverpod demo application. It is a simple todo app with Hive as local database and GoRouter for navigation."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.5
  hive_ce: ^2.15.0
  hive_ce_flutter: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.10.0
  build_runner: ^2.9.0

flutter:
  uses-material-design: true
